<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"></>
</head>
<body>

    

    <header>
        <div class="headerContainer">
            <div class="headerTitle">
                <h1>Rock,Paper,Scissors</h1>
            </div>

            <div class="rstBtn">
                <button id="rstBtn">Reset Game</button>
            </div>
        </div>
    </header>

    <div class="game">

        <div class="infoContainer">

            <div class="human">

                <div class="imgContainer">
                    <img src="imgs\user-svgrepo-com.svg">
                </div>

                <div class="scoreContainer">
                    <p>Score: <span id="humanScore">0</span></p>
                </div>
            
            </div>

            <div class="vs">

                <div class="imgContainer">
                    <img src="imgs\versus.png">
                </div>

                <div class="scoreContainer">
                    <p>Ties: <span id="tieScore">0</span></p>
                </div>

            </div>

            <div class="computer">

                <div class="imgContainer">
                    <img src="imgs\computer-svgrepo-com.svg">
                </div>

                <div class="scoreContainer">
                    <p>Score: <span id="computerScore">0</span></p>
                </div>

            </div>

        </div>

        <div class="buttonsContainer">

            <div class="heading">
                <h2>Your Choices:</h2>
            </div>
            
            <div class="buttons">

                <div class="rock">
                    <button id="rockBtn"><img src="imgs\rock-svgrepo-com.svg" alt="rock"></button>
                </div>

                <div class="paper">
                    <button id="paperBtn"><img src="imgs\paper-roll-svgrepo-com.svg" alt="paper"></button>
                </div>

                <div class="scissor">
                    <button id="scissorBtn"><img src="imgs\scissors-svgrepo-com.svg" alt="scissor"></button>
                </div>

            </div>
            
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
